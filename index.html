<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VRFS Football Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans">

  <!-- Header -->
  <div id="header" class="bg-gray-800 border-b border-gray-700 px-4 py-3 flex items-center justify-between">
    <div>
      <div class="font-bold text-lg">⚽ VRFS FC</div>
      <div id="headerSub" class="text-xs text-gray-400">Strength: -- · Position: --</div>
    </div>
    <div class="text-right">
      <div id="headerGames" class="text-sm font-medium">-- games left</div>
      <div id="headerForm" class="text-xs text-gray-400">4-3-3</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="flex border-b border-gray-700 text-sm">
    <button class="tab-btn flex-1 py-2 font-medium border-b-2 border-blue-500 text-blue-400" data-tab="squad">Squad</button>
    <button class="tab-btn flex-1 py-2 font-medium text-gray-400" data-tab="tactics">Tactics</button>
    <button class="tab-btn flex-1 py-2 font-medium text-gray-400" data-tab="season">Season</button>
    <button class="tab-btn flex-1 py-2 font-medium text-gray-400" data-tab="stats">Stats</button>
  </div>

  <main id="content" class="p-4 max-w-2xl mx-auto"></main>

  <script>
  // ── Players ───────────────────────────────────────
  const RAW = [
    { name: "Mr Blu",          shooting: 74, passing: 55, defending: 48 },
    { name: "KillCam",         shooting: 82, passing: 44, defending: 38 },
    { name: "JacobPFC",        shooting: 58, passing: 76, defending: 52 },
    { name: "Bargain Bucket",  shooting: 40, passing: 52, defending: 79 },
    { name: "GiGi",            shooting: 33, passing: 45, defending: 85 },
    { name: "BG",              shooting: 65, passing: 68, defending: 50 },
    { name: "Neuer",           shooting: 28, passing: 60, defending: 91 },
    { name: "Ludi",            shooting: 70, passing: 48, defending: 44 },
    { name: "Danaldo",         shooting: 88, passing: 62, defending: 35 },
    { name: "Thunder",         shooting: 77, passing: 50, defending: 42 },
    { name: "Tullien",         shooting: 50, passing: 72, defending: 58 },
    { name: "Luxien",          shooting: 44, passing: 55, defending: 75 },
    { name: "Maddox",          shooting: 61, passing: 80, defending: 46 },
    { name: "Evra",            shooting: 48, passing: 66, defending: 72 },
    { name: "Hydro",           shooting: 79, passing: 53, defending: 40 },
    { name: "SR28",            shooting: 55, passing: 60, defending: 63 },
    { name: "Nuno Mendes",     shooting: 42, passing: 58, defending: 78 },
    { name: "Kuba",            shooting: 68, passing: 71, defending: 45 },
    { name: "FLOPZ",           shooting: 83, passing: 47, defending: 36 },
    { name: "rhys",            shooting: 52, passing: 64, defending: 60 },
    { name: "Godly",           shooting: 76, passing: 58, defending: 43 },
    { name: "Bobby da piss man",shooting: 71, passing: 49, defending: 55 },
    { name: "Shark",           shooting: 85, passing: 42, defending: 33 },
    { name: "Fz",              shooting: 46, passing: 74, defending: 56 },
    { name: "Kirby",           shooting: 63, passing: 55, defending: 65 },
    { name: "Sancho",          shooting: 78, passing: 67, defending: 38 },
    { name: "Kuna",            shooting: 37, passing: 50, defending: 83 },
    { name: "Tjay",            shooting: 69, passing: 62, defending: 47 },
    { name: "Zync",            shooting: 54, passing: 78, defending: 50 },
    { name: "Belles",          shooting: 41, passing: 56, defending: 80 },
  ];

  function assignPos(p) {
    const t = p.shooting + p.passing + p.defending;
    const sr = p.shooting / t, dr = p.defending / t;
    if (dr > 0.38) return "GK";
    if (dr > 0.33) return "DEF";
    if (sr > 0.36) return "FWD";
    return "MID";
  }

  const PLAYERS = RAW.map((p, id) => ({
    ...p, id,
    position: assignPos(p),
    overall: Math.round((p.shooting + p.passing + p.defending) / 3),
    goals: 0, assists: 0, appearances: 0,
  }));

  // Ensure a GK
  if (!PLAYERS.some(p => p.position === "GK")) {
    const top = [...PLAYERS].sort((a,b) => b.defending - a.defending)[0];
    PLAYERS.find(p => p.id === top.id).position = "GK";
  }

  // ── CPU Teams ─────────────────────────────────────
  const CPU = [
    { name: "Red Devils FC",   strength: 72 },
    { name: "Blue City",       strength: 65 },
    { name: "United Stars",    strength: 68 },
    { name: "Rovers Athletic", strength: 60 },
    { name: "Town FC",         strength: 55 },
  ];

  const MY_TEAM = "VRFS FC";
  const POS_COLOR = { GK: "bg-yellow-600", DEF: "bg-blue-700", MID: "bg-green-700", FWD: "bg-red-700" };

  // ── State ─────────────────────────────────────────
  let activeTab  = "squad";
  let formation  = "4-3-3";
  let lineup     = PLAYERS.slice(0, Math.min(5, PLAYERS.length)).map(p => p.id);
  let players    = PLAYERS.map(p => ({...p}));
  let matchLog   = [];
  let fixtures   = genFixtures();

  function genFixtures() {
    const all = [MY_TEAM, ...CPU.map(t => t.name)];
    const fx = [];
    for (let i = 0; i < all.length; i++)
      for (let j = 0; j < all.length; j++)
        if (i !== j) fx.push({ home: all[i], away: all[j], played: false, hg: null, ag: null });
    return fx;
  }

  function teamStrength() {
    if (!lineup.length) return 60;
    return Math.round(lineup.map(id => players.find(p => p.id === id)?.overall || 60).reduce((a,b)=>a+b,0) / lineup.length);
  }

  function simMatch(hStr, aStr) {
    const r = () => Math.random();
    const hg = Math.floor(r() * r() * ((hStr + 5) / 100 * 4.5));
    const ag = Math.floor(r() * r() * (aStr / 100 * 4.5));
    return { hg, ag };
  }

  function getStandings() {
    const all = [MY_TEAM, ...CPU.map(t => t.name)];
    const tbl = Object.fromEntries(all.map(t => [t, { name:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0 }]));
    fixtures.filter(f => f.played).forEach(f => {
      const h = tbl[f.home], a = tbl[f.away];
      if (!h||!a) return;
      h.p++; a.p++; h.gf+=f.hg; h.ga+=f.ag; a.gf+=f.ag; a.ga+=f.hg;
      if (f.hg>f.ag){h.w++;h.pts+=3;a.l++;}
      else if(f.hg<f.ag){a.w++;a.pts+=3;h.l++;}
      else{h.d++;a.d++;h.pts++;a.pts++;}
    });
    return Object.values(tbl).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga));
  }

  function remaining() { return fixtures.filter(f => f.home === MY_TEAM && !f.played).length; }

  // ── Header update ─────────────────────────────────
  function updateHeader() {
    const standings = getStandings();
    const pos = standings.findIndex(t => t.name === MY_TEAM) + 1;
    document.getElementById("headerSub").textContent = `Strength: ${teamStrength()} · Position: ${pos}/${standings.length}`;
    document.getElementById("headerGames").textContent = `${remaining()} games left`;
    document.getElementById("headerForm").textContent = formation;
  }

  // ── Tabs ──────────────────────────────────────────
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => {
        b.classList.remove("border-b-2","border-blue-500","text-blue-400");
        b.classList.add("text-gray-400");
      });
      btn.classList.add("border-b-2","border-blue-500","text-blue-400");
      btn.classList.remove("text-gray-400");
      activeTab = btn.dataset.tab;
      render();
    });
  });

  // ── Render ────────────────────────────────────────
  function render() {
    updateHeader();
    const c = document.getElementById("content");
    if (activeTab === "squad")   c.innerHTML = renderSquad();
    if (activeTab === "tactics") c.innerHTML = renderTactics();
    if (activeTab === "season")  c.innerHTML = renderSeason();
    if (activeTab === "stats")   c.innerHTML = renderStats();
    bindEvents();
  }

  function renderSquad() {
    return `<p class="text-xs text-gray-400 mb-3">Tap a player to toggle in/out of lineup (${lineup.length} selected)</p>` +
      players.map(p => {
        const inL = lineup.includes(p.id);
        return `<div class="player-toggle rounded-lg px-4 py-3 flex items-center gap-3 cursor-pointer border-2 mb-2 transition-colors ${inL?'border-blue-500 bg-gray-800':'border-transparent bg-gray-800/50'}" data-pid="${p.id}">
          <span class="text-xs font-bold px-2 py-1 rounded ${POS_COLOR[p.position]}">${p.position}</span>
          <div class="flex-1">
            <div class="font-medium">${p.name}</div>
            <div class="text-xs text-gray-400">SHO ${p.shooting} · PAS ${p.passing} · DEF ${p.defending}</div>
          </div>
          <div class="text-right">
            <div class="font-bold text-lg">${p.overall}</div>
            <div class="text-xs text-gray-500">OVR</div>
          </div>
        </div>`;
      }).join("");
  }

  function renderTactics() {
    const formations = ["4-3-3","4-4-2","3-5-2","5-3-2","4-2-3-1"];
    const fBtns = formations.map(f =>
      `<button class="form-btn py-2 rounded-lg text-sm font-medium border-2 ${formation===f?'border-blue-500 bg-blue-900/40 text-blue-400':'border-gray-700 bg-gray-800 text-gray-300'}" data-f="${f}">${f}</button>`
    ).join("");

    const rows = formation.split("-").map((n, row, arr) => {
      const label = row===0?"GK":row===arr.length-1?"FWD":row===1?"DEF":"MID";
      const circles = Array.from({length:parseInt(n)}).map(() =>
        `<div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-xs font-bold shadow">${label}</div>`
      ).join("");
      return `<div class="flex justify-center gap-3">${circles}</div>`;
    }).join("");

    const lineupNames = lineup.map(id => {
      const p = players.find(x => x.id === id);
      return p ? `<span class="text-xs bg-gray-700 px-2 py-1 rounded">${p.name}</span>` : "";
    }).join("");

    return `
      <div class="space-y-4">
        <div>
          <p class="text-sm text-gray-400 mb-2">Formation</p>
          <div class="grid grid-cols-3 gap-2">${fBtns}</div>
        </div>
        <div class="bg-green-900/40 border border-green-700 rounded-xl p-4 text-center">
          <div class="text-xs text-green-400 mb-3 font-medium uppercase">Pitch View · ${formation}</div>
          <div class="space-y-3">${rows}</div>
        </div>
        <div class="bg-gray-800 rounded-lg p-3">
          <p class="text-xs text-gray-400 mb-2">Current Lineup (${lineup.length} players)</p>
          <div class="flex flex-wrap gap-2">${lineupNames || '<span class="text-xs text-gray-500">No players selected</span>'}</div>
        </div>
      </div>`;
  }

  function renderSeason() {
    const standings = getStandings();
    const rows = standings.map((t, i) => `
      <tr class="border-b border-gray-800 ${t.name===MY_TEAM?'bg-blue-900/20':''}">
        <td class="py-2 text-gray-400 text-xs">${i+1}</td>
        <td class="py-2 font-medium text-sm">${t.name}${t.name===MY_TEAM?' 🎮':''}</td>
        <td class="py-2 text-center text-gray-300 text-sm">${t.p}</td>
        <td class="py-2 text-center text-green-400 text-sm">${t.w}</td>
        <td class="py-2 text-center text-yellow-400 text-sm">${t.d}</td>
        <td class="py-2 text-center text-red-400 text-sm">${t.l}</td>
        <td class="py-2 text-center text-sm ${t.gf-t.ga>0?'text-green-400':t.gf-t.ga<0?'text-red-400':'text-gray-400'}">${t.gf-t.ga>0?'+':''}${t.gf-t.ga}</td>
        <td class="py-2 text-center font-bold text-sm">${t.pts}</td>
      </tr>`).join("");

    const log = matchLog.length
      ? `<div class="bg-gray-800 rounded-lg p-3 space-y-1 mt-4">
           <p class="text-xs text-gray-400 uppercase font-medium mb-2">Recent Results</p>
           ${matchLog.map(l=>`<p class="text-sm">${l}</p>`).join("")}
         </div>` : "";

    const rem = remaining();
    return `
      <div class="overflow-x-auto mb-4">
        <table class="w-full text-sm">
          <thead><tr class="text-gray-400 text-xs uppercase border-b border-gray-700">
            <th class="py-2 text-left">#</th><th class="py-2 text-left">Team</th>
            <th class="py-2 text-center">P</th><th class="py-2 text-center">W</th>
            <th class="py-2 text-center">D</th><th class="py-2 text-center">L</th>
            <th class="py-2 text-center">GD</th><th class="py-2 text-center font-bold text-white">Pts</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="flex gap-2">
        <button id="btnNext" ${rem===0?'disabled':''} class="flex-1 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-700 disabled:text-gray-500 rounded-lg py-3 font-medium text-sm">▶ Play Next Game</button>
        <button id="btnAll"  ${rem===0?'disabled':''} class="flex-1 bg-gray-700 hover:bg-gray-600 disabled:bg-gray-800 disabled:text-gray-600 rounded-lg py-3 font-medium text-sm">⏩ Sim Rest</button>
      </div>
      ${log}`;
  }

  function renderStats() {
    return `<p class="text-xs text-gray-400 mb-3">Player statistics this season</p>` +
      [...players].sort((a,b)=>b.goals-a.goals).map(p => `
        <div class="bg-gray-800 rounded-lg px-4 py-3 flex items-center gap-3 mb-2">
          <span class="text-xs font-bold px-2 py-1 rounded shrink-0 ${POS_COLOR[p.position]}">${p.position}</span>
          <div class="flex-1 min-w-0">
            <div class="font-medium text-sm">${p.name}</div>
            <div class="text-xs text-gray-400">${p.appearances} apps</div>
          </div>
          <div class="flex gap-4 text-sm">
            <div class="text-center"><div class="text-green-400 font-bold">${p.goals}</div><div class="text-xs text-gray-500">G</div></div>
            <div class="text-center"><div class="text-blue-400 font-bold">${p.assists}</div><div class="text-xs text-gray-500">A</div></div>
          </div>
        </div>`).join("");
  }

  // ── Event binding ─────────────────────────────────
  function bindEvents() {
    document.querySelectorAll(".player-toggle").forEach(el => {
      el.addEventListener("click", () => {
        const id = parseInt(el.dataset.pid);
        lineup = lineup.includes(id) ? lineup.filter(x=>x!==id) : [...lineup, id];
        render();
      });
    });

    document.querySelectorAll(".form-btn").forEach(btn => {
      btn.addEventListener("click", () => { formation = btn.dataset.f; render(); });
    });

    const btnNext = document.getElementById("btnNext");
    if (btnNext) btnNext.addEventListener("click", playNext);

    const btnAll = document.getElementById("btnAll");
    if (btnAll) btnAll.addEventListener("click", playAll);
  }

  function playNext() {
    const next = fixtures.find(f => f.home === MY_TEAM && !f.played);
    if (!next) return;
    const cpuStr = CPU.find(t => t.name === next.away)?.strength || 65;
    const { hg, ag } = simMatch(teamStrength(), cpuStr);

    const outfield = lineup.map(id => players.find(p => p.id === id)).filter(Boolean);
    let g = hg;
    while (g-- > 0 && outfield.length) {
      const s = outfield[Math.floor(Math.random()*outfield.length)];
      players.find(p=>p.id===s.id).goals++;
      if (outfield.length > 1) {
        const others = outfield.filter(p=>p.id!==s.id);
        players.find(p=>p.id===others[Math.floor(Math.random()*others.length)].id).assists++;
      }
    }
    outfield.forEach(p => players.find(x=>x.id===p.id).appearances++);

    fixtures.find(f=>f===next).played = true;
    fixtures.find(f=>f===next).hg = hg;
    fixtures.find(f=>f===next).ag = ag;
    matchLog = [`⚽ ${next.home} ${hg} – ${ag} ${next.away}`, ...matchLog].slice(0,20);
    render();
  }

  function playAll() {
    fixtures = fixtures.map(f => {
      if (f.played) return f;
      let hStr, aStr;
      if (f.home===MY_TEAM){hStr=teamStrength();aStr=CPU.find(t=>t.name===f.away)?.strength||65;}
      else if(f.away===MY_TEAM){hStr=CPU.find(t=>t.name===f.home)?.strength||65;aStr=teamStrength();}
      else{hStr=CPU.find(t=>t.name===f.home)?.strength||65;aStr=CPU.find(t=>t.name===f.away)?.strength||65;}
      const {hg,ag} = simMatch(hStr,aStr);
      return {...f,played:true,hg,ag};
    });
    render();
  }

  render();
  </script>
</body>
</html>
